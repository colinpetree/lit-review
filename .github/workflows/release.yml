name: Publish release

# Turns the tested Candidate into a signed, published release (modelled on personal-website's
# release.yml). You never type a version or push a tag.
#
# How a release happens:
#   1. Merge to main. CI (ci.yml) builds it as the next patch version, tests it, and if
#      everything passes leaves a draft "Candidate 0.1.4 (<sha>), tested against v0.1.3"
#      holding the exact files it tested. Each new passing merge replaces it, so several
#      merges ship together as one version.
#   2. When you want to release: Actions -> Publish release -> Run workflow (leave "Use
#      workflow from" on main) and pick patch, minor or major.
#      From a terminal: gh workflow run release.yml -f bump=patch
#        patch   ships the Candidate's tested files as they are. Nothing is built.
#        minor / major
#                rebuilds the Candidate's commit with that version (it is compiled into the
#                app) and runs every check again, including the update rehearsal.
#   3. The run leaves a draft "Lit Review X.Y.Z" with the downloads and the update manifest,
#      then waits for you: GitHub emails you, you can try the downloads, then click Review
#      deployments -> Approve. The `sign` job (environment `release`, the only job that can
#      read the signing key) signs the manifest, publishes the release and checks it the
#      way the app will. Installed copies then find it on their next daily check.
#
# Draft titles:
#   Uploading <version> (<sha7>)                        files still uploading; ignored here
#   Candidate <version> (<sha7>), tested against <tag>  complete, ready to publish
#   Publishing <version> (<sha7>), tested against <tag> claimed by a run of this workflow
#   Lit Review X.Y.Z                                    made by this workflow, waiting to be
#                                                       approved and signed
# The run renames the Candidate it picks to "Publishing" first, and CI never deletes a
# "Publishing" or "Lit Review" draft, so a merge landing mid-publish cannot pull it away.
#
# If it stops:
#   - A minor/major rebuild that fails hands the draft back as "Candidate" (release-claim).
#   - Anything else partway (a GitHub error): run it again with the same bump; it carries on
#     from the "Publishing" draft.
#   - You rejected Approve or never gave it: the "Lit Review X.Y.Z" draft waits, unpublished
#     and untagged (the tag is only made when it is published). Sign it later with Re-run
#     failed jobs on that run, or delete the draft to give up (the version number is free
#     again and the next merge to main makes a new Candidate).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch ships the tested Candidate as is; minor or major rebuilds it with that version"
        type: choice
        options: [patch, minor, major]
        default: patch
      required_update:
        description: "Rare: a required update. Every older copy installs it at its next start, whatever its own setting (see RELEASING.md first)"
        type: boolean
        default: false
      notice:
        description: "Optional: a short notice shown with the update (say why, if it is required)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One Publish at a time, never cancelled halfway. Only the jobs before `sign` are in the
    # group, so a run waiting days for Approve never holds up anything else.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # rename (claim) the Candidate draft
    outputs:
      draft: ${{ steps.plan.outputs.draft }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
    env:
      BUMP: ${{ inputs.bump }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find and check the tested draft
        id: plan
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Publish release must run on main (this run is on '$GITHUB_REF_NAME'). To try a branch, use Actions -> CI -> Run workflow with mode test."
            exit 1
          fi

          # Newest first. A draft an earlier run claimed comes before any Candidate, so a
          # failed publish is finished rather than abandoned.
          list="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,name \
            -q '.[] | select(.isDraft) | [.tagName, .name] | @tsv')"
          waiting="$(echo "$list" | awk -F'\t' '$2 ~ /^Lit Review [0-9]+\.[0-9]+\.[0-9]+$/ { print $1 }')"
          claimed_drafts="$(echo "$list" | awk -F'\t' '$2 ~ /^Publishing / { print $1 }')"
          if [ -n "$waiting" ]; then
            if [ -n "$claimed_drafts" ]; then
              # An earlier run made the release draft but failed before it finished (it deletes
              # the claimed Candidate as its last act). That draft is unsigned and incomplete:
              # remove it and carry on from the claimed Candidate, which still has the files.
              echo "$waiting" | while read -r t; do
                echo "Removing $t, left unfinished by an earlier Publish release run."
                gh release delete "$t" --repo "$GITHUB_REPOSITORY" -y
              done
            else
              echo "::error::Release draft $(echo "$waiting" | head -1) is waiting to be approved and signed. Approve it (on its Publish release run: Re-run failed jobs, then Approve), or delete that draft on the Releases page, then run this again."
              exit 1
            fi
          fi
          candidates="$(echo "$list" | awk -F'\t' '$2 ~ /^Candidate / { print $1 }')"
          if [ -n "$claimed_drafts" ]; then
            if [ "$(echo "$claimed_drafts" | wc -l)" -gt 1 ]; then
              echo "::error::More than one draft is marked 'Publishing' ($(echo "$claimed_drafts" | tr '\n' ' ')). Delete the ones you don't want on the Releases page, then run this again."
              exit 1
            fi
            draft="$claimed_drafts"
            claimed=true
            echo "Carrying on with draft $draft, claimed by an earlier Publish release run."
          elif [ -n "$candidates" ]; then
            draft="$(echo "$candidates" | head -1)"
            claimed=false
          else
            echo "::error::No tested build waiting. Merge to main and wait for CI to pass; it leaves a 'Candidate' draft release to publish."
            exit 1
          fi
          title="$(gh release view "$draft" --repo "$GITHUB_REPOSITORY" --json name -q .name)"
          sha="$(gh release view "$draft" --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish)"
          # "Candidate 0.1.4 (abc1234), tested against v0.1.3" (or "Publishing ...")
          built="$(echo "$title" | sed -E 's/^(Candidate|Publishing) ([0-9]+\.[0-9]+\.[0-9]+) \(.*$/\2/')"
          tested_against="${title##*tested against }"

          fail() {
            echo "::error::$1"
            if [ "$claimed" = true ]; then
              echo "::error::Draft '$title' was claimed by an earlier Publish release run. To start over, delete it on the Releases page; the next CI run on main makes a new Candidate."
            fi
            exit 1
          }

          [[ "$built" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Cannot read the version from the draft title '$title'."
          git fetch -q --tags origin main
          git cat-file -e "$sha^{commit}" 2>/dev/null || fail "The draft '$title' points at $sha, which is not in this repository."
          git merge-base --is-ancestor "$sha" origin/main || fail "The draft '$title' was built from $sha, which is not on main (was main force-pushed?). Merge to main again to get a new Candidate."

          previous="$(bash .github/scripts/previous-release.sh)"
          base="${previous#v}"
          base="${base:-0.0.0}"
          IFS=. read -r major minor patch <<< "$base"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
          esac
          version="$major.$minor.$patch"

          if [ "$BUMP" = "patch" ]; then
            rebuild=false
            [ "$built" = "$version" ] || fail "The Candidate was built as $built, but the next patch after ${previous:-nothing} is $version. Re-run the latest CI run on main to get a new Candidate."
            [ "$tested_against" = "${previous:-none}" ] || fail "The Candidate was tested against $tested_against, but the newest release is ${previous:-none}. Re-run the latest CI run on main."
          else
            rebuild=true
            # The rebuild (build-test.yml) checks out this run's own commit, the newest on main
            # when Publish release was started, never a commit passed in: so the Candidate must
            # be that very commit (and the workflow files then match the code they build).
            [ "$sha" = "$GITHUB_SHA" ] || fail "main has commits after the Candidate (${sha::7}, main is at ${GITHUB_SHA::7}); a $BUMP release rebuilds, so wait for CI on main to finish (it makes a newer Candidate), then run Publish release again."
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            fail "Tag v$version already exists. If it is left over from something else, delete it (git push --delete origin v$version) and run this again."
          fi

          # Claim the draft, so CI's draft job won't delete it if a merge lands while this
          # runs. Then read it back: if CI deleted it in the moment between our list and the
          # rename, stop.
          if [ "$claimed" = false ]; then
            gh release edit "$draft" --repo "$GITHUB_REPOSITORY" --title "Publishing ${title#Candidate }" >/dev/null \
              || { echo "::error::Could not claim draft $draft (it was probably replaced by a newer build just now). Run this again."; exit 1; }
            now="$(gh release view "$draft" --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)"
            if [[ "$now" != "Publishing "* ]]; then
              echo "::error::Draft $draft was replaced by a newer build while this started. Run this again."
              exit 1
            fi
            title="$now"
          fi

          newer="$(git log --no-merges --format='- %h %s' "$sha..origin/main")"
          {
            echo "draft=$draft"
            echo "sha=$sha"
            echo "previous=$previous"
            echo "version=$version"
            echo "rebuild=$rebuild"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Draft | $title |"
            echo "| Commit | \`${sha::7}\` |"
            echo "| Version | ${previous:-none} -> **v$version** ($BUMP) |"
            echo "| Files | $([ "$rebuild" = true ] && echo "rebuilt as $version and tested again" || echo "the Candidate's tested files, as they are") |"
            echo ""
            if [ -n "$newer" ]; then
              echo "**Not included:** these commits on main came after the tested build. Their CI either failed or has not finished:"
              echo ""
              echo "$newer"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # minor or major only: the version is compiled into the app, so the Candidate (built as
  # the next patch) is rebuilt with the new version and every check runs again.
  build:
    needs: plan
    if: needs.plan.outputs.rebuild == 'true'
    concurrency:
      group: publish-build
      cancel-in-progress: false
    uses: ./.github/workflows/build-test.yml
    with:
      # No `ref`: it builds this run's commit, which plan checked is the Candidate's.
      version: ${{ needs.plan.outputs.version }}
      previous: ${{ needs.plan.outputs.previous }}
      artifact_name: publish-${{ needs.plan.outputs.version }}
      rehearse_update: true
      retention_days: 30

  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # make the release draft, delete the claimed Candidate
    env:
      DRAFT: ${{ needs.plan.outputs.draft }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      REBUILD: ${{ needs.plan.outputs.rebuild }}
      REQUIRED: ${{ inputs.required_update }}
      NOTICE: ${{ inputs.notice }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Get the Candidate's files
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh release download "$DRAFT" --repo "$GITHUB_REPOSITORY" --dir candidate
          (cd candidate && ls -l && sha256sum -c SHA256SUMS.txt)

      - name: Get the rebuilt files (minor/major)
        if: needs.plan.outputs.rebuild == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-${{ needs.plan.outputs.version }}
          path: rebuilt

      # A patch ships the Candidate's files. A rebuild ships the new files, but only if it
      # bundled exactly the packages the Candidate was tested with.
      - name: Choose the release files
        run: |
          set -euo pipefail
          if [ "$REBUILD" = true ]; then
            for f in candidate/requirements-*.txt; do
              if ! diff -u "$f" "rebuilt/$(basename "$f")"; then
                echo "::error::The rebuild bundled different Python packages than the tested Candidate ($(basename "$f"), above). Re-run the latest CI run on main, then publish again."
                exit 1
              fi
            done
            mv rebuilt out
          else
            mv candidate out
          fi
          cd out
          rm -f update-manifest.json update-manifest.json.sig dependency-changes.md
          sha256sum -c SHA256SUMS.txt
          ls -l

      - name: Make the update manifest (unsigned; the sign job signs it)
        run: |
          args=(--version "$VERSION" --dir out)
          if [ -n "$NOTICE" ]; then args+=(--notice "$NOTICE"); fi
          # A required update: the floor is this release itself, so every older copy must take it.
          if [ "$REQUIRED" = "true" ]; then
            args+=(--min-version "$VERSION")
            echo "**Required update:** every copy older than $VERSION installs it at its next start." >> "$GITHUB_STEP_SUMMARY"
          fi
          python packaging/make_manifest.py "${args[@]}"

      - name: Write the release notes
        run: |
          set -euo pipefail
          {
            sed "s/{{VERSION}}/$VERSION/g" packaging/release-notes.md
            echo ""
            if [ -n "$PREVIOUS" ]; then
              echo "### Changes since $PREVIOUS"
              echo ""
              git log --no-merges --format='- %s' "$PREVIOUS..$SHA"
              echo ""
              echo "Full list: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...v$VERSION"
              echo ""
            fi
            # The dependency report CI wrote into the Candidate's notes.
            gh release view "$DRAFT" --repo "$GITHUB_REPOSITORY" --json body -q .body | tr -d '\r' \
              | sed -n '/^## Dependency changes since the previous release/,$p'
          } > notes.md

      # The release draft is a new draft named for the version, with its tag set but not yet
      # made: GitHub creates tag vX.Y.Z on the tested commit only when the draft is
      # published, so a release that is never approved leaves no tag behind.
      - name: Make the release draft
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # "Re-run failed jobs" after this step failed partway: the draft it made is unsigned
          # and may be incomplete, so it is made again (a published release is never touched).
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)" = "true" ]; then
            echo "Replacing the unfinished draft $tag from an earlier attempt."
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" -y
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "Lit Review $VERSION" --notes-file notes.md \
            out/*.zip out/*.dmg out/SHA256SUMS.txt out/update-manifest.json out/requirements-*.txt

          got="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)"
          want="$(cd out && ls ./*.zip ./*.dmg SHA256SUMS.txt update-manifest.json requirements-*.txt | sed 's|^\./||' | sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::The release draft has unexpected files. Expected:"; echo "$want"; echo "Got:"; echo "$got"
            exit 1
          fi
          # The claimed Candidate has done its job.
          gh release delete "$DRAFT" --repo "$GITHUB_REPOSITORY" -y
          {
            echo "## Lit Review $VERSION is ready as a draft"
            echo ""
            echo "Try the downloads on the Releases page if you like. Then, on this run: **Review deployments -> release -> Approve**. GitHub then signs, publishes and checks it."
          } >> "$GITHUB_STEP_SUMMARY"

  # Waits for your Approve (environment `release`: you as required reviewer, main only).
  # The only job that can read the signing key, so it installs nothing but cryptography
  # (hash-pinned) and runs nothing but sign_release.py, from the commit being released (so
  # the public keys it checks against are the ones inside that app).
  sign:
    needs: [plan, publish]
    # Explicit: for a patch `build` is skipped, and GitHub's default condition skips a job when
    # any job earlier in its chain was skipped, even though `publish` itself ran.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # upload the signature, publish the release, remove old test builds
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the signing tool's one package
        run: python -m pip install --require-hashes --no-deps -r packaging/requirements-sign.txt

      - name: Sign, publish and verify
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PASSPHRASE: ${{ secrets.UPDATE_SIGNING_PASSPHRASE }}
        run: python packaging/sign_release.py "v$VERSION" --ci --publish

      # A stable release clears away the test pre-releases and their tags.
      - name: Remove old test builds
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -- '-test\.' || true; } | while read -r t; do
              echo "Deleting test pre-release $t"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            done
          echo "Published **Lit Review $VERSION**. Installed copies find it on their next daily check." >> "$GITHUB_STEP_SUMMARY"

  # A minor/major rebuild that failed (or a cancelled run) must not leave the Candidate
  # claimed forever: later runs would keep picking it. Hand it back, unless the release
  # draft was already made (then the Candidate is gone and Approve is what is left).
  release-claim:
    needs: [plan, build, publish]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'failure' || needs.build.result == 'cancelled' || needs.publish.result == 'failure' || needs.publish.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DRAFT: ${{ needs.plan.outputs.draft }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Hand the Candidate back
        shell: bash
        run: |
          set -euo pipefail
          title="$(gh release view "$DRAFT" --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)"
          if [[ "$title" != "Publishing "* ]]; then
            echo "Draft $DRAFT is not claimed (now '$title'); nothing to hand back."
            exit 0
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release draft v$VERSION was made; leaving $DRAFT for a re-run to finish."
            exit 0
          fi
          newer="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json isDraft,name -q '.[] | select(.isDraft and (.name | startswith("Candidate "))) | .name' | head -1)"
          if [ -n "$newer" ]; then
            gh release delete "$DRAFT" --repo "$GITHUB_REPOSITORY" -y
            echo "A newer Candidate exists ($newer); removed the claimed one." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release edit "$DRAFT" --repo "$GITHUB_REPOSITORY" --title "Candidate ${title#Publishing }"
            echo "Handed $DRAFT back as a Candidate; fix the problem and publish again." >> "$GITHUB_STEP_SUMMARY"
          fi
