name: Release

# Builds Lit Review for Windows and macOS (Apple Silicon and Intel) and, when a version
# tag such as v0.1.0 is pushed, attaches the downloads (a Windows zip, and for each Mac a
# disk image for people plus a zip for the in-app updater) to a DRAFT GitHub Release for
# the maintainer to test and publish. Run by hand ("Run workflow") it only builds and
# keeps the files as artifacts, so a trial never makes a release.
#
# PyInstaller cannot cross-compile, so each operating system builds its own.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The tag '$tag' must look like v1.2.3"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::The tag '$tag' is not on the main branch"
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

  # macOS 26 ("Liquid Glass") draws an app icon from a layered Icon Composer package compiled
  # into Assets.car. Xcode 26 (which has `actool`) is on macos-latest but may not be on the
  # Intel runner, so it is compiled once here and both Mac builds use the result. The icon is
  # part of every release: if it cannot be compiled, or packaging/macos/AppIcon.icon is gone,
  # this job fails and so does the release, rather than shipping the classic icon unnoticed.
  icon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compile the layered icon
        shell: bash
        run: |
          test -d packaging/macos/AppIcon.icon || { echo "::error::packaging/macos/AppIcon.icon is missing"; exit 1; }
          xcodebuild -version
          mkdir icon-out
          xcrun actool packaging/macos/AppIcon.icon --compile icon-out --app-icon AppIcon \
            --include-all-app-icons --enable-on-demand-resources NO --development-region en \
            --target-device mac --minimum-deployment-target 26.0 --platform macosx \
            --output-partial-info-plist icon-out/partial.plist --output-format human-readable-text
          echo "--- what actool wrote"
          ls -l icon-out
          cat icon-out/partial.plist
          test -f icon-out/Assets.car || { echo "::error::actool did not make Assets.car"; exit 1; }
          echo "--- what is in Assets.car"
          xcrun assetutil --info icon-out/Assets.car | sed -n '1,60p'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-icon
          path: icon-out/Assets.car
          if-no-files-found: error

  build:
    needs: [prepare, icon]
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Windows
            exe: dist/Lit Review/Lit Review.exe
            # test_app_instances.py starts real copies of the app; it is verified on Windows
            # (where its process handling was written) and left out of the Mac legs for now.
            pytest_args: ""
          - os: macos-latest # Apple Silicon
            asset: macOS-Apple-Silicon
            exe: dist/Lit Review.app/Contents/MacOS/Lit Review
            pytest_args: --ignore=tests/test_app_instances.py
          - os: macos-15-intel # Intel
            asset: macOS-Intel
            exe: dist/Lit Review.app/Contents/MacOS/Lit Review
            pytest_args: --ignore=tests/test_app_instances.py
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt
            backend/requirements-dev.txt

      # First, on its own: the exact pinned versions must have wheels for this operating
      # system and chip, and a missing one should fail here, plainly.
      - name: Install Python packages
        run: python -m pip install -r backend/requirements-build.txt -r backend/requirements-dev.txt

      - name: Frontend (lint, tests, build into backend/static)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q ${{ matrix.pytest_args }}

      - name: Put the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sed -i.bak "s/^__version__ = .*/__version__ = \"$VERSION\"/" backend/version.py
          rm backend/version.py.bak
          grep -x "__version__ = \"$VERSION\"" backend/version.py

      - name: Make the icons
        run: python packaging/make_icons.py

      - name: Make the macOS icon file (iconutil exists only on a Mac)
        if: runner.os == 'macOS'
        run: iconutil -c icns packaging/build/LitReview.iconset -o packaging/build/LitReview.icns

      # The compiled Liquid Glass icon. It goes in packaging/build so the
      # spec (which then names it in Info.plist) and the copy below can find it.
      - name: Get the compiled macOS 26 icon
        if: runner.os == 'macOS'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-icon
          path: packaging/build

      - name: List third-party licenses
        run: python packaging/make_notices.py

      - name: Build the app
        run: pyinstaller backend/pyinstaller.spec --noconfirm

      # Assets.car must be a real file in Contents/Resources, and it must be there before the
      # signature is made, or the signature would not cover it.
      - name: Put the macOS 26 icon in the app
        if: runner.os == 'macOS'
        run: |
          cp packaging/build/Assets.car "dist/Lit Review.app/Contents/Resources/Assets.car"
          plutil -p "dist/Lit Review.app/Contents/Info.plist" | grep "CFBundleIconName"
          ls -l "dist/Lit Review.app/Contents/Resources" | sed -n '1,20p'

      # An unsigned download can be reported as "damaged" if its signature is broken, so the
      # build is signed ad hoc (free; the first-launch prompt still appears and the guide covers it).
      - name: Sign the macOS app ad hoc
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist/Lit Review.app"
          codesign --verify --deep --strict --verbose=2 "dist/Lit Review.app"

      - name: Run the built app (self-check, then a real launch)
        run: python packaging/smoke_test.py "${{ matrix.exe }}"

      # The license and the third-party notices are inside the app (pyinstaller.spec puts them in
      # its `licenses` folder, before the signature), so the zip holds only the app. The listings
      # show where they landed and what the zip's top level is (for the Mac, only the .app).
      - name: Zip it
        run: |
          mkdir out
          name="Lit-Review-$VERSION-${{ matrix.asset }}"
          echo "--- where the license files are inside the app"
          python -c "import pathlib; hits = list(pathlib.Path('dist').rglob('licenses/THIRD_PARTY_NOTICES.txt')); print(*hits, sep='\n'); raise SystemExit(0 if hits else '::error::the notices file is not in the app')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import shutil; shutil.make_archive('out/$name', 'zip', root_dir='dist', base_dir='Lit Review')"
            python -m zipfile -l "out/$name.zip" | grep -E "Lit Review/(Lit Review.exe|_internal/licenses)" || true
          else
            ditto -c -k --sequesterRsrc --keepParent "dist/Lit Review.app" "out/$name.zip"
            echo "--- the zip's top level (it must be only Lit Review.app)"
            unzip -Z1 "out/$name.zip" | cut -d/ -f1 | sort -u
          fi
          ls -l out

      # The Mac download people use: open the disk image, drag Lit Review onto Applications.
      # It holds the same signed, smoke-tested app as the zip (which the in-app updater uses), so
      # it is made last. It is then mounted and checked: it must hold only the app and the
      # Applications link, the app must still verify as signed, run from the read-only volume
      # (--self-check), and refuse to start from it. The trap detaches it on every exit path.
      - name: Make the Mac disk image
        if: runner.os == 'macOS'
        run: |
          name="Lit-Review-$VERSION-${{ matrix.asset }}"
          # dmgbuild writes the window layout (app on the left, Applications on the right)
          # without driving Finder, so it works on a headless runner.
          python -m pip install dmgbuild==1.6.5
          dmgbuild -s packaging/macos/dmg-settings.py -D app="dist/Lit Review.app" "Lit Review" "out/$name.dmg"
          hdiutil verify "out/$name.dmg"
          mnt="$(mktemp -d)"
          cleanup() { hdiutil detach "$mnt" -quiet || hdiutil detach "$mnt" -force -quiet || true; }
          trap cleanup EXIT
          hdiutil attach "out/$name.dmg" -readonly -nobrowse -mountpoint "$mnt"
          echo "--- what is in the disk image"
          ls -l "$mnt"
          test "$(ls "$mnt")" = "$(printf 'Applications\nLit Review.app')" || { echo "::error::the disk image holds something unexpected"; exit 1; }
          test "$(readlink "$mnt/Applications")" = "/Applications" || { echo "::error::the Applications link is wrong"; exit 1; }
          codesign --verify --deep --strict "$mnt/Lit Review.app"
          # The app's start-up check refuses to run from a read-only volume (mac_app.py). Prove it
          # sees Applications as writable (else it would block every install) and the image as
          # read-only, and that the app launched from the image really does refuse (exit 1).
          readonly_flag() { python -c "import os, sys; print(os.statvfs(sys.argv[1]).f_flag & 1)" "$1"; }
          test "$(readonly_flag /Applications)" = 0 || { echo "::error::Applications reads as read-only"; exit 1; }
          test "$(readonly_flag "$mnt")" = 1 || { echo "::error::the disk image reads as writable"; exit 1; }
          export LIT_REVIEW_DATA_DIR="$RUNNER_TEMP/dmg-data" LIT_REVIEW_CONFIG_DIR="$RUNNER_TEMP/dmg-config"
          export LIT_REVIEW_NO_DIALOG=1 LIT_REVIEW_NO_BROWSER=1 LIT_REVIEW_NO_TRAY=1
          app="$mnt/Lit Review.app/Contents/MacOS/Lit Review"
          LIT_REVIEW_SELFCHECK_FILE="$RUNNER_TEMP/dmg-selfcheck.json" "$app" --self-check
          python - "$app" <<'PY'
          import subprocess, sys
          try:
              code = subprocess.run([sys.argv[1]], timeout=60).returncode
          except subprocess.TimeoutExpired:
              sys.exit("::error::the app started from the disk image instead of refusing")
          sys.exit(0 if code == 1 else f"::error::expected exit code 1 from the disk image, got {code}")
          PY
          # Exit code 1 is also what other start-up failures return. The check runs before the
          # instance lock is taken, so a lock file means the app got past it and failed later.
          test ! -e "$LIT_REVIEW_DATA_DIR/instance.lock" || { echo "::error::the app got past the start-up check"; exit 1; }
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      # Five downloads: the Windows zip, and for each Mac a disk image (for people) and a zip
      # (for the in-app updater). A missing one must stop the release, not publish without it.
      - name: Check the downloads are all here
        run: |
          cd out
          ls -l
          shopt -s nullglob
          zips=(*.zip)
          dmgs=(*.dmg)
          if [ "${#zips[@]}" -ne 3 ] || [ "${#dmgs[@]}" -ne 2 ]; then
            echo "::error::expected 3 zips and 2 disk images, found ${#zips[@]} and ${#dmgs[@]}: ${zips[*]} ${dmgs[*]}"
            exit 1
          fi

      - name: Checksums
        run: |
          cd out
          sha256sum *.zip *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The notes link straight to each download (the Assets list on a release page starts
      # collapsed), and those links contain the version, so fill it in here.
      - name: Fill the version into the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: sed "s/{{VERSION}}/$VERSION/g" packaging/release-notes.md > release-notes.md

      # A draft: nothing is public until the maintainer has tried the downloads
      # and pressed Publish. (A draft is also invisible to the app's update check.)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          name: Lit Review ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            out/*.zip
            out/*.dmg
            out/SHA256SUMS.txt
