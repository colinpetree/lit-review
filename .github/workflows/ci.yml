name: CI

# Builds and tests every change (modelled on personal-website's ci.yml). Jobs:
#   lint              ruff, oxlint, actionlint (about a minute)
#   backend-tests     pytest on Windows (with coverage) and macOS
#   frontend-tests    Vitest (library and component tests), then a production build
#   e2e               the background-job flow in a real browser, from source, with the AI
#                     and the paper sources faked (Windows)
#   build             build-test.yml: the three platform builds and the checks of the built
#                     app (smoke test, disk images, browser walk, upgrade test, and on main
#                     the update rehearsal from the previous release)
#   dependency-review pull requests only
# Security scanning (CodeQL) is its own workflow, codeql.yml.
#
# What happens after everything passes depends on what started the run:
#
#   push to main    Builds as the NEXT PATCH version (after v0.1.3, every merge builds as
#                   0.1.4) and leaves a DRAFT release, "Candidate 0.1.4 (<sha>), tested
#                   against v0.1.3", holding the exact files that were tested. Each new
#                   passing push replaces it, so several merges ship together as one
#                   version. To release it: Actions -> Publish release -> Run workflow
#                   (release.yml). Drafts are private and the app never sees them.
#   pull request    Tests only (version label <newest release>-ci.<sha>).
#   Run workflow    Any branch, by hand:
#                     trial  tests only, nothing is published.
#                     test   publishes the branch as a PRE-release
#                            (v<newest>-test.<branch>.<sha>) with the downloads, to try on a
#                            real computer. The in-app updater never offers a pre-release.
#
# Versions come from published releases; the repository's version.py always says
# 0.0.0-dev. "Previous" is the newest published (not draft, not pre-release) vX.Y.Z
# release on main, so a stray hand-pushed tag can never become the base.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "trial: build and test only. test: also publish a test build of this branch as a pre-release."
        type: choice
        options: [trial, test]
        default: trial

permissions:
  contents: read

# On main and on pull requests only the newest push matters, so a newer push cancels an
# older run. A test build publishes, so it is never cancelled halfway.
concurrency:
  group: ${{ inputs.mode == 'test' && format('test-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.mode != 'test' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out the version
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then mode="$INPUT_MODE";
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then mode=main;
          else mode=ci; fi

          # What this build is tested against (upgrade test, rehearsal, dependency notes): the
          # newest published release. What it is numbered from: the highest version already used
          # by a release or a tag (a pulled release's tag stays), so a number is never reused.
          previous="$(bash .github/scripts/previous-release.sh)"
          base="$(bash .github/scripts/version-base.sh)"
          base="${base:-0.0.0}"
          IFS=. read -r major minor patch <<< "$base"
          sha7="${GITHUB_SHA::7}"

          case "$mode" in
            main)
              version="$major.$minor.$((patch + 1))"
              ;;
            ci|trial)
              version="$base-ci.$sha7"
              ;;
            test)
              # Lowercase; anything outside a-z 0-9 - becomes -, so CI/CD -> ci-cd.
              slug="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-40)"
              version="$base-test.$slug.$sha7"
              if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
                echo "::error::Tag v$version already exists. Delete that pre-release (and its tag) or push a new commit."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown mode '$mode'"
              exit 1
              ;;
          esac
          release=false
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && release=true

          {
            echo "mode=$mode"
            echo "version=$version"
            echo "previous=$previous"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Build plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | \`$mode\` |"
            echo "| Branch | \`$BRANCH\` @ \`$sha7\` |"
            echo "| Version | **$version** |"
            echo "| Tested against (newest published release) | ${previous:-none} |"
            echo "| Highest version used so far (releases and tags) | ${base} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Fast checks, alongside the builds, so a typo fails in about a minute.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Python: ruff (ruff.toml)"
        run: |
          python -m pip install --quiet "$(grep '^ruff==' backend/requirements-dev.txt)"
          ruff check --output-format=github .

      - name: "JavaScript: oxlint (frontend/.oxlintrc.json)"
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      # Also shellchecks every `run:` block, at warning level.
      - name: "Workflows: actionlint"
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        env:
          SHELLCHECK_OPTS: -S warning
        with:
          version: 1.7.12
          files: .github/workflows/*.yml
          pyflakes: false

  # The backend suite (backend/tests/). conftest.py points every test at a temporary data
  # folder and refuses any network connection, so nothing here can reach a real service or
  # spend money. test_app_instances.py starts real copies of the app; it is verified on
  # Windows (where its process handling was written) and left out on macOS for now.
  backend-tests:
    name: backend-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Windows leg with coverage took 16 to 20+ minutes on GitHub's runners (about 7 on a
    # desktop), and a run cut off at 20 had no failing test. Generous, so only a real hang stops it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Coverage floor: measured 95% when set (November 2026); raise it as tests grow,
            # never lower it to make a change pass.
            pytest_args: --cov=. --cov-report=term --cov-fail-under=93
          - os: macos-latest
            pytest_args: --ignore=tests/test_app_instances.py
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt

      - name: Run the tests
        env:
          PYTEST_ARGS: ${{ matrix.pytest_args }}
        run: |
          # PYTEST_ARGS is a list of options, split into words on purpose.
          # shellcheck disable=SC2086
          python -m pytest -q -ra $PYTEST_ARGS

      - name: Coverage summary
        if: always() && runner.os == 'Windows'
        run: |
          {
            echo "## Backend test coverage"
            echo ""
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Production build
        run: npm run build

  # Creating a dataset, finding abstracts, grading and exporting, through the real pages and
  # the real job threads, with the AI provider and the paper sources replaced by fakes and
  # every network connection refused (backend/tests/e2e_server.py).
  e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd frontend || exit 1
          npm ci
          npm run build
          npx playwright install chromium

      - name: "Job flow: dataset, lookup, evaluation, stop, resume, export"
        run: python packaging/browser_test.py --jobs --artifacts "$RUNNER_TEMP/e2e-failures"

      - name: Upload browser evidence (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e-failures
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: prepare
    uses: ./.github/workflows/build-test.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      previous: ${{ needs.prepare.outputs.previous }}
      artifact_name: release-${{ needs.prepare.outputs.version }}
      rehearse_update: ${{ needs.prepare.outputs.release == 'true' }}

  # Pull requests only: fails on a newly added dependency with a known high-severity
  # vulnerability (the monthly audit and Dependabot alerts cover what is already in).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # Push to main only: keep exactly one Candidate draft, for the newest commit that passed.
  # (dependency-review is not in `needs`: it is skipped on a push, and a skipped job a job
  # needs would skip this one too.) Draft titles say what state a draft is in:
  #   Uploading <version> (<sha7>)                        files still uploading (or cut off);
  #                                                       never published
  #   Candidate <version> (<sha7>), tested against <tag>  complete; what Publish release uses
  #   Publishing <version> (<sha7>), tested against <tag> claimed by a Publish release run;
  #                                                       this job never deletes it
  draft:
    needs: [prepare, build, lint, backend-tests, frontend-tests, e2e]
    if: needs.prepare.outputs.mode == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create and delete draft releases
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: out

      - name: Check the files again
        run: |
          cd out || exit 1
          ls -l
          sha256sum -c SHA256SUMS.txt

      - name: Write the notes
        run: |
          set -euo pipefail
          {
            echo "**Candidate build** of \`main\` at ${SHA::7}, built as version $VERSION and tested against ${PREVIOUS:-no earlier release}. Not released yet."
            echo ""
            echo "To release it: **Actions > Publish release > Run workflow**, pick patch, then Approve. Nothing is rebuilt: these exact files become Lit Review $VERSION. (Minor or major rebuilds this commit with that version first.)"
            echo ""
            if [ -n "$PREVIOUS" ]; then
              echo "### Commits since $PREVIOUS"
              echo ""
              git log --no-merges --format='- %h %s' "$PREVIOUS..$SHA"
              echo ""
              echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$SHA"
            else
              echo "### Commits"
              echo ""
              git log --no-merges --format='- %h %s' -n 50 "$SHA"
            fi
            echo ""
            cat out/dependency-changes.md
          } > notes.md

      # Create the new draft BEFORE deleting the old ones, so a cancelled run never leaves
      # you with nothing to publish. It is created as "Uploading" and only renamed
      # "Candidate" once every file is there, so a cut-off upload is never picked.
      - name: Create the draft release
        run: |
          set -euo pipefail
          tag="ci-${SHA::7}"
          # A rerun of the same commit replaces its own draft (same code), unless a Publish
          # release run has already claimed it.
          existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,name -q 'select(.isDraft) | .name' 2>/dev/null || true)"
          case "$existing" in
            "") ;;
            "Publishing "*)
              echo "::notice::Draft $tag is being published by a Publish release run; leaving it alone."
              exit 0 ;;
            *) gh release delete "$tag" --repo "$GITHUB_REPOSITORY" -y ;;
          esac
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "Uploading $VERSION (${SHA::7})" --notes-file notes.md \
            out/*.zip out/*.dmg out/SHA256SUMS.txt out/requirements-*.txt

          # Every file must be on the draft before it becomes a Candidate.
          got="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)"
          want="$(cd out && ls ./*.zip ./*.dmg SHA256SUMS.txt requirements-*.txt | sed 's|^\./||' | sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::The draft is missing files. Expected:"; echo "$want"; echo "Got:"; echo "$got"
            exit 1
          fi
          # The title is read back by release.yml: keep "Candidate <version> (<sha7>)" and the
          # ", tested against <tag|none>" ending.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Candidate $VERSION (${SHA::7}), tested against ${PREVIOUS:-none}"
          echo "Draft release **Candidate $VERSION (${SHA::7})** is ready. Publish it from Actions > Publish release." >> "$GITHUB_STEP_SUMMARY"

      # Older Candidate drafts and cut-off Uploading drafts go; a draft a Publish release run
      # has claimed ("Publishing ...") or made ("Lit Review X.Y.Z") is never touched. The title
      # is checked again right before each delete, in case Publish claimed it meanwhile.
      - name: Remove older drafts
        run: |
          set -euo pipefail
          keep="ci-${SHA::7}"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,name \
            -q '.[] | select(.isDraft and ((.name | startswith("Candidate ")) or (.name | startswith("Uploading ")))) | .tagName' \
            | { grep -vx -- "$keep" || true; } | while read -r t; do
              name="$(gh release view "$t" --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)"
              case "$name" in
                "Candidate "*|"Uploading "*)
                  echo "Deleting older draft $t ($name)"
                  gh release delete "$t" --repo "$GITHUB_REPOSITORY" -y || true ;;
                *) echo "Leaving $t alone (now '$name')" ;;
              esac
            done

  # Run workflow with mode "test" only: publish this branch as a pre-release to try on a real
  # computer. The in-app updater never offers a pre-release.
  testbuild:
    needs: [prepare, build, lint, backend-tests, frontend-tests, e2e]
    if: needs.prepare.outputs.mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the pre-release and its tag
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: out

      - name: Check the files again
        run: |
          cd out || exit 1
          ls -l
          sha256sum -c SHA256SUMS.txt

      - name: Publish the pre-release
        run: |
          set -euo pipefail
          {
            echo "**TEST BUILD** of branch \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}, version $VERSION. Not a release: it is a pre-release, so the in-app updater never offers it."
            echo ""
            echo "Changes: https://github.com/$GITHUB_REPOSITORY/compare/${PREVIOUS:-main}...${GITHUB_SHA}"
            echo ""
            cat out/dependency-changes.md
          } > notes.md
          # Publishing (not a draft) creates the tag on the exact commit that was built.
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Test build $VERSION" --notes-file notes.md \
            out/*.zip out/*.dmg out/SHA256SUMS.txt
          echo "Published test build **v$VERSION**." >> "$GITHUB_STEP_SUMMARY"
