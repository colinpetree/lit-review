<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- icon.webp is the real favicon; favicon.ico is the fallback for clients that
         never read this tag and request /favicon.ico blindly (crawlers, old browsers). -->
    <link rel="icon" type="image/webp" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before first paint so there is no flash. Keep in
      // sync with applyTheme() in src/lib/theme.js.
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>Lit Review Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
